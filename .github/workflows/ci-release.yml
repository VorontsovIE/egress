name: CI and release

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.3'
          cache-dependency-path: client/tun-engine/go.sum
      - uses: docker/setup-buildx-action@v4
      - name: Install locked development environment
        run: uv sync --locked --project egressd --extra dev
      - name: Run offline test suites
        run: |
          export EGRESSD_STATE_DIR="$(mktemp -d)"
          export EGRESSD_METRICS_DB="$EGRESSD_STATE_DIR/metrics.sqlite"
          export EGRESSD_GEO_DIR="$EGRESSD_STATE_DIR/geo"
          uv run --locked --project egressd python -m pytest tests/ client/tests/ -q
          uv run --locked --project egressd python -m pytest tests/security/ -q
          uv run --locked --project egressd python -m pytest tests/install/ -q
      - name: Validate Compose and build backend image
        run: |
          docker compose config --quiet
          docker buildx build --platform linux/amd64 -f egressd/Dockerfile . --output=type=cacheonly

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: checks
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.3.3
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.3'
          cache-dependency-path: client/tun-engine/go.sum
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v4
      - name: Validate release tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
      - name: Build TUN engines and source archive
        run: |
          scripts/build-tun-engine.sh
          mkdir -p release/egress-${VERSION}/client/tun-engine/dist
          git archive HEAD | tar -x -C release/egress-${VERSION}
          cp client/tun-engine/dist/egress-tun-engine-linux-* release/egress-${VERSION}/client/tun-engine/dist/
          sed -i "s/^version = .*/version = \"${VERSION}\"/" client/pyproject.toml
          sed -i "s/__version__ = .*/__version__ = \"${VERSION}\"/" client/src/egress_client/__init__.py
          uv build --wheel --project client --out-dir release
          cp client/tun-engine/dist/egress-tun-engine-linux-amd64 release/
          cp client/tun-engine/dist/egress-tun-engine-linux-arm64 release/
          mkdir -p release/egress-${VERSION}/release-assets
          cp "release/egress_client-${VERSION}-py3-none-any.whl" \
            release/egress-${VERSION}/release-assets/
          cp release/egress-tun-engine-linux-amd64 release/egress-tun-engine-linux-arm64 \
            release/egress-${VERSION}/release-assets/
          (cd release/egress-${VERSION}/release-assets && sha256sum * > SHA256SUMS)
          cp scripts/egress-install release/egress-install
          tar -C release -czf "release/egress-${VERSION}.tar.gz" "egress-${VERSION}"
          (cd release && sha256sum "egress_client-${VERSION}-py3-none-any.whl" \
            egress-tun-engine-linux-amd64 egress-tun-engine-linux-arm64 "egress-${VERSION}.tar.gz" > SHA256SUMS)
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish multi-architecture egressd image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: egressd/Dockerfile
          build-args: |
            EGRESSD_VERSION=${{ env.VERSION }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/vorontsovie/egress:${{ github.ref_name }}
            ghcr.io/vorontsovie/egress:latest
          labels: |
            org.opencontainers.image.source=https://github.com/VorontsovIE/egress
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/egress_client-${{ env.VERSION }}-py3-none-any.whl
            release/egress-tun-engine-linux-amd64
            release/egress-tun-engine-linux-arm64
            release/egress-install
            release/egress-${{ env.VERSION }}.tar.gz
            release/SHA256SUMS
      - name: Attest release assets
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            release/egress_client-${{ env.VERSION }}-py3-none-any.whl
            release/egress-tun-engine-linux-amd64
            release/egress-tun-engine-linux-arm64
            release/egress-install
            release/egress-${{ env.VERSION }}.tar.gz
            release/SHA256SUMS
