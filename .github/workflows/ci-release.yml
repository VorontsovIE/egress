name: CI and release

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'
      - uses: docker/setup-buildx-action@v3
      - name: Install locked development environment
        run: uv sync --locked --project egressd --extra dev
      - name: Run offline test suites
        run: |
          export EGRESSD_STATE_DIR="$(mktemp -d)"
          export EGRESSD_METRICS_DB="$EGRESSD_STATE_DIR/metrics.sqlite"
          export EGRESSD_GEO_DIR="$EGRESSD_STATE_DIR/geo"
          uv run --locked --project egressd python -m pytest tests/ client/tests/ -q
          uv run --locked --project egressd python -m pytest tests/security/ -q
          uv run --locked --project egressd python -m pytest tests/install/ -q
      - name: Validate Compose and build backend image
        run: |
          docker compose config --quiet
          docker buildx build --platform linux/amd64 -f egressd/Dockerfile . --output=type=cacheonly

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Validate release tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
      - name: Build TUN engines and source archive
        run: |
          scripts/build-tun-engine.sh
          mkdir -p release/vibelab-egress-${VERSION}
          git archive HEAD | tar -x -C release/vibelab-egress-${VERSION}
          mkdir -p release/vibelab-egress-${VERSION}/client/tun-engine/dist
          cp client/tun-engine/dist/* release/vibelab-egress-${VERSION}/client/tun-engine/dist/
          sed -i "s/^version = \"[0-9][^"]*\"/version = \"${VERSION}\"/" release/vibelab-egress-${VERSION}/client/pyproject.toml
          tar -C release -czf "release/vibelab-egress-${VERSION}.tar.gz" "vibelab-egress-${VERSION}"
          sha256sum release/vibelab-egress-${VERSION}.tar.gz > release/SHA256SUMS
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish multi-architecture egressd image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: egressd/Dockerfile
          build-args: |
            EGRESSD_VERSION=${{ env.VERSION }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/vorontsovie/egress:${{ github.ref_name }}
            ghcr.io/vorontsovie/egress:latest
          labels: |
            org.opencontainers.image.source=https://github.com/VorontsovIE/egress
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/vibelab-egress-${{ env.VERSION }}.tar.gz
            release/SHA256SUMS
