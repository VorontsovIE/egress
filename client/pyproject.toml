[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "egress-client"
version = "0.1.0"
description = "egress client package (egressctl + egress-run), stdlib-only"
requires-python = ">=3.11"
# Dependency-free on purpose: the same package must install in a bare host
# and in a container runtime/Docker container without a package index.
dependencies = []

[project.scripts]
egressctl = "egress_client.egressctl:main"
egress-run = "egress_client.egress_run:main"

[tool.setuptools]
package-dir = {"" = "src", "adapters" = "../adapters"}
packages = ["egress_client", "adapters", "adapters.blanc", "adapters.xeovo"]
